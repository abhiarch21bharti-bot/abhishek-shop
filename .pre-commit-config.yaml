repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: pytest
        name: Run pytest
        entry: python -m pytest
        language: system
        pass_filenames: false
        always_run: true

      - id: mypy
        name: Run mypy
        entry: python -m mypy
        language: system
        pass_filenames: false
        always_run: true
